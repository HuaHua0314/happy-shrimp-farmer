<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>快樂蝦農｜家人同步訂單</title>
<style>
:root{--o:#ed7b31;--g:#173d38;--bg:#fff8ee;--line:#eadfce;--red:#b83b31;--green:#237650}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243431;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}header{padding:18px;background:#ffe3bd;border-bottom:1px solid var(--line)}header>div,main{max-width:1100px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;color:var(--g)}.sub{font-size:13px;color:#69736f}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 5px 18px #533d2610}.auth{max-width:430px;margin:45px auto}.hidden{display:none!important}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:20px 0}.stat b{display:block;font-size:26px;color:var(--g);margin-top:5px}label{display:block;font-size:13px;font-weight:700;margin-top:11px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc4b8;border-radius:8px;margin-top:5px;font:inherit}textarea{min-height:70px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;background:#eee9e0}.primary{background:var(--o);color:#fff}.danger{background:#ffebe8;color:var(--red)}.success{background:#e4f5eb;color:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:15px 0}.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:10px;border-bottom:1px solid #eee7dd;text-align:left;vertical-align:top;font-size:14px}th{background:#faf5ed;font-size:12px}.muted{font-size:12px;color:#707a76}.notice{background:#fff1d7;padding:10px;border-radius:8px;margin:10px 0}.error{background:#ffebe8;color:var(--red)}dialog{border:0;border-radius:15px;padding:0;width:min(720px,calc(100% - 20px))}dialog::backdrop{background:#183832aa}.modal{padding:18px}.g2{grid-template-columns:1fr 1fr}.empty{text-align:center;padding:30px;color:#777}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><div><h1>🦐 快樂蝦農</h1><div class="sub">第一版・家人同步訂單系統</div></div><div id="userBox" class="actions hidden"><span id="who" class="sub"></span><button class="btn" id="logout">登出</button></div></div></header>
<main>
<section id="authBox" class="card auth"><h2>登入共用訂單</h2><p class="sub">家人使用同一組 Email 與密碼，就能共同管理相同訂單。</p><div id="msg" class="notice hidden"></div><label>Email<input id="email" type="email"></label><label>密碼<input id="password" type="password" minlength="6"></label><label>操作人名稱<input id="operator" placeholder="例如：花花、爸爸"></label><div class="actions" style="margin-top:15px"><button id="login" class="btn primary">登入</button><button id="register" class="btn">第一次使用：註冊</button></div></section>
<section id="app" class="hidden">
<div class="grid stats"><div class="card stat"><span>訂單總包數</span><b id="packs">0</b></div><div class="card stat"><span>訂單總金額</span><b id="amount">$0</b></div><div class="card stat"><span>未出貨包數</span><b id="unshipped">0</b></div><div class="card stat"><span>未收款筆數</span><b id="unpaid">0</b></div></div>
<section class="card"><div class="actions between"><div><h2 style="margin:0">訂單管理</h2><span class="sub">資料會即時同步</span></div><div class="actions"><button id="productsBtn" class="btn">商品管理</button><button id="add" class="btn primary">＋ 新增訂單</button></div></div>
<div class="toolbar"><input id="search" placeholder="搜尋姓名、聯絡方式或備註"><select id="shipFilter"><option value="">全部出貨狀態</option><option value="0">未出貨</option><option value="1">已出貨</option></select><select id="payFilter"><option value="">全部收款狀態</option><option value="0">未收款</option><option value="1">已收款</option></select><button id="export" class="btn">匯出 CSV</button></div>
<div class="table"><table><thead><tr><th>客人</th><th>商品／數量</th><th>金額</th><th>取貨</th><th>出貨</th><th>收款</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></section>
</main>
<dialog id="orderDialog"><form id="orderForm" class="modal"><div class="actions between"><h2 id="formTitle">新增訂單</h2><button type="button" class="btn close">關閉</button></div><input id="oid" type="hidden"><div class="grid g2"><label>訂購人姓名<input id="customer" required></label><label>聯絡方式<select id="contactType"><option>Line</option><option>IG</option><option>FB</option><option>電話</option><option>其他</option></select></label><label id="contactOtherBox" class="hidden">其他聯絡方式<input id="contactOther" placeholder="請自行輸入"></label><label>商品<select id="product"></select></label><label>訂購數量<input id="qty" type="number" min="0" value="1" required></label><label>贈送數量<input id="gift" type="number" min="0" value="0"></label><label>取貨方式<select id="delivery"><option>超商</option><option>宅配</option><option>面交</option><option>其他</option></select></label><label id="deliveryDetailBox">超商門市<select id="deliveryDetail"></select></label><label id="deliveryOtherBox" class="hidden">其他取貨方式<input id="deliveryOther" placeholder="請自行輸入"></label><label>出貨<select id="shipped"><option value="0">未出貨</option><option value="1">已出貨</option></select></label><label>收款<select id="paid"><option value="0">未收款</option><option value="1">已收款</option></select></label></div><label>備註<textarea id="notes"></textarea></label><div id="calc" class="notice"></div><button class="btn primary" type="submit">儲存訂單</button></form></dialog>
<dialog id="productDialog"><form id="productForm" class="modal"><div class="actions between"><h2>商品管理</h2><button type="button" class="btn close">關閉</button></div><div id="productList"></div><hr style="border:0;border-top:1px solid #ddd;margin:18px 0"><div class="grid g2"><label>商品名稱<input id="pname" required></label><label>單價<input id="pprice" type="number" min="0" required></label></div><button class="btn primary" style="margin-top:12px">新增商品</button></form></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const config={apiKey:"AIzaSyB6Wf3e-IvRbrqx5DMObkPdWIbHdOX_PnY",authDomain:"happy-shrimp-order.firebaseapp.com",databaseURL:"https://happy-shrimp-order-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"happy-shrimp-order",storageBucket:"happy-shrimp-order.firebasestorage.app",messagingSenderId:"117758119538",appId:"1:117758119538:web:9bc9087f6e5f113369fceb"};firebase.initializeApp(config);
const $=x=>document.getElementById(x),auth=firebase.auth(),db=firebase.database(),money=n=>"$"+Number(n||0).toLocaleString("zh-TW"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let uid="",orders={},products={},operator="";
function message(t,bad){$("msg").textContent=t;$("msg").className="notice"+(bad?" error":"")}
async function sign(mode){const e=$("email").value.trim(),p=$("password").value,o=$("operator").value.trim();if(!e||!p||!o)return message("請填寫 Email、密碼與操作人名稱。",1);localStorage.setItem("shrimpOperator",o);try{mode==="login"?await auth.signInWithEmailAndPassword(e,p):await auth.createUserWithEmailAndPassword(e,p)}catch(x){message(x.code==="auth/email-already-in-use"?"這個 Email 已註冊，請直接登入。":"無法登入，請檢查 Email 與密碼。",1)}}
$("login").onclick=()=>sign("login");$("register").onclick=()=>sign("register");$("logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{if(!u){$("authBox").classList.remove("hidden");$("app").classList.add("hidden");$("userBox").classList.add("hidden");return}uid=u.uid;operator=localStorage.getItem("shrimpOperator")||"家人";$("who").textContent=operator;$("authBox").classList.add("hidden");$("app").classList.remove("hidden");$("userBox").classList.remove("hidden");const pr=db.ref(`users/${uid}/products`);if(!(await pr.once("value")).exists())await pr.push({name:"檸檬蝦",price:99});pr.on("value",s=>{products=s.val()||{};renderProducts();fillProducts()});db.ref(`users/${uid}/orders`).on("value",s=>{orders=s.val()||{};render()})});
function fillProducts(selected){$("product").innerHTML=Object.entries(products).map(([id,p])=>`<option value="${id}" ${id===selected?"selected":""}>${esc(p.name)}（${money(p.price)}）</option>`).join("");calculate()}function calculate(){const p=products[$("product").value]||{price:0},q=+$("qty").value||0,g=+$("gift").value||0;$("calc").textContent=`總包數 ${q+g} 包・應收 ${money(q*p.price)}`}
["product","qty","gift"].forEach(id=>$(id).oninput=calculate);
function updateContact(){const other=$("contactType").value==="其他";$("contactOtherBox").classList.toggle("hidden",!other);$("contactOther").required=other}
function updateDelivery(selected){const type=$("delivery").value,options={超商:["全家","7-11","其他"],面交:["土庫","九如","竹田","萬巒","其他"]};if(options[type]){$("deliveryDetailBox").classList.remove("hidden");$("deliveryDetailBox").firstChild.textContent=type==="超商"?"超商門市":"面交地點";$("deliveryDetail").innerHTML=options[type].map(x=>`<option>${x}</option>`).join("");if(selected&&options[type].includes(selected))$("deliveryDetail").value=selected}else{$("deliveryDetailBox").classList.add("hidden");$("deliveryDetail").innerHTML=""}updateDeliveryOther()}
function updateDeliveryOther(){const other=$("delivery").value==="其他"||$("deliveryDetail").value==="其他";$("deliveryOtherBox").classList.toggle("hidden",!other);$("deliveryOther").required=other}
$("contactType").onchange=updateContact;$("delivery").onchange=()=>updateDelivery();$("deliveryDetail").onchange=updateDeliveryOther;
function contactText(o){return o.contactType==="其他"?(o.contactOther||"其他"):(o.contactType||o.contact||"")}function deliveryText(o){return o.deliveryOther||o.deliveryDetail||o.detail||""}
function openOrder(id){$("orderForm").reset();$("oid").value=id||"";$("formTitle").textContent=id?"編輯訂單":"新增訂單";$("qty").value=1;$("gift").value=0;fillProducts();updateContact();updateDelivery();if(id){const o=orders[id];$("customer").value=o.customer;$("contactType").value=o.contactType||(["Line","IG","FB","電話"].includes(o.contact)?o.contact:"其他");$("contactOther").value=o.contactOther||($("contactType").value==="其他"?(o.contact||""):"");updateContact();fillProducts(o.productId);$("qty").value=o.qty;$("gift").value=o.gift||0;$("delivery").value=o.delivery||"超商";updateDelivery(o.deliveryDetail||o.detail);$("deliveryOther").value=o.deliveryOther||((o.delivery==="其他"||o.deliveryDetail==="其他")?(o.detail||""):"");updateDeliveryOther();$("shipped").value=o.shipped?"1":"0";$("paid").value=o.paid?"1":"0";$("notes").value=o.notes||"";calculate()}$("orderDialog").showModal()}
$("add").onclick=()=>openOrder();$("orderForm").onsubmit=async e=>{e.preventDefault();const id=$("oid").value||db.ref(`users/${uid}/orders`).push().key,p=products[$("product").value],old=orders[id]||{};await db.ref(`users/${uid}/orders/${id}`).set({customer:$("customer").value.trim(),contactType:$("contactType").value,contactOther:$("contactOther").value.trim(),productId:$("product").value,productName:p.name,unitPrice:+p.price,qty:+$("qty").value||0,gift:+$("gift").value||0,amount:(+$("qty").value||0)*(+p.price),delivery:$("delivery").value,deliveryDetail:$("deliveryDetail").value||"",deliveryOther:$("deliveryOther").value.trim(),shipped:$("shipped").value==="1",paid:$("paid").value==="1",notes:$("notes").value.trim(),createdAt:old.createdAt||firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:operator});$("orderDialog").close()};
function visible(){const q=$("search").value.toLowerCase(),s=$("shipFilter").value,p=$("payFilter").value;return Object.entries(orders).filter(([,o])=>(!q||[o.customer,contactText(o),o.notes].join(" ").toLowerCase().includes(q))&&(!s||String(+!!o.shipped)===s)&&(!p||String(+!!o.paid)===p)).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0))}
function render(){const a=Object.values(orders);$("packs").textContent=a.reduce((n,o)=>n+(+o.qty||0)+(+o.gift||0),0);$("amount").textContent=money(a.reduce((n,o)=>n+(+o.amount||0),0));$("unshipped").textContent=a.filter(o=>!o.shipped).reduce((n,o)=>n+(+o.qty||0)+(+o.gift||0),0);$("unpaid").textContent=a.filter(o=>!o.paid).length;const v=visible();$("rows").innerHTML=v.length?v.map(([id,o])=>`<tr><td><b>${esc(o.customer)}</b><div class="muted">${esc(contactText(o))}</div></td><td>${esc(o.productName)}<div class="muted">訂購 ${o.qty}＋贈送 ${o.gift||0}</div></td><td><b>${money(o.amount)}</b></td><td>${esc(o.delivery)}<div class="muted">${esc(deliveryText(o))}</div></td><td><button class="btn ${o.shipped?"success":"danger"}" onclick="toggle('${id}','shipped')">${o.shipped?"已出貨":"未出貨"}</button></td><td><button class="btn ${o.paid?"success":"danger"}" onclick="toggle('${id}','paid')">${o.paid?"已收款":"未收款"}</button></td><td><div class="actions"><button class="btn" onclick="openOrder('${id}')">編輯</button><button class="btn danger" onclick="removeOrder('${id}')">刪除</button></div><div class="muted">${esc(o.updatedBy||"")}</div></td></tr>`).join(""):`<tr><td colspan="7" class="empty">目前沒有訂單</td></tr>`}
window.toggle=(id,k)=>db.ref(`users/${uid}/orders/${id}`).update({[k]:!orders[id][k],updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:operator});window.removeOrder=id=>confirm("確定刪除這筆訂單？")&&db.ref(`users/${uid}/orders/${id}`).remove();["search","shipFilter","payFilter"].forEach(id=>$(id).oninput=render);
$("productsBtn").onclick=()=>$("productDialog").showModal();function renderProducts(){$("productList").innerHTML=Object.entries(products).map(([id,p])=>`<div class="actions between" style="padding:9px 0;border-bottom:1px solid #eee"><span><b>${esc(p.name)}</b>・${money(p.price)}</span><button class="btn danger" onclick="removeProduct('${id}')">刪除</button></div>`).join("")}window.removeProduct=id=>{if(Object.values(orders).some(o=>o.productId===id))return alert("此商品已有訂單使用，不能刪除。");if(Object.keys(products).length<2)return alert("至少保留一項商品。");confirm("確定刪除？")&&db.ref(`users/${uid}/products/${id}`).remove()};$("productForm").onsubmit=async e=>{e.preventDefault();await db.ref(`users/${uid}/products`).push({name:$("pname").value.trim(),price:+$("pprice").value||0});$("pname").value="";$("pprice").value=""};
document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest("dialog").close());$("operator").value=localStorage.getItem("shrimpOperator")||"";
$("export").onclick=()=>{const r=[["訂購人","聯絡方式","商品","訂購數量","贈送數量","金額","取貨","說明","出貨","收款","備註"],...Object.values(orders).map(o=>[o.customer,contactText(o),o.productName,o.qty,o.gift,o.amount,o.delivery,deliveryText(o),o.shipped?"已出貨":"未出貨",o.paid?"已收款":"未收款",o.notes])],csv="\ufeff"+r.map(x=>x.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="快樂蝦農訂單.csv";a.click()};
</script>
</body></html>
